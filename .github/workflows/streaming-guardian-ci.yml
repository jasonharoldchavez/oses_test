name: Streaming Guardian CI

on:
  push:
    branches:
      - main
      - hardening-oses-benchmarks
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Streaming Guardian
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<3" pytest

      - name: Compile source and benchmark modules
        run: python -m compileall -q streaming_guardian benchmarks tests

      - name: Run detector and metric regression tests
        run: |
          python -m pytest -q             tests/test_detector.py             tests/test_detector_validation.py             tests/test_benchmark_metrics.py \
            tests/test_certificate.py
