name: Streaming Guardian CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-sdk:
    name: Validate Streaming Guardian SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Install package
        run: |
          pip install -e .

      - name: Verify Python syntax
        run: |
          python -m compileall streaming_guardian

      - name: Run test suite
        run: |
          pytest tests

      - name: Build package check
        run: |
          python -m pip install build
          python -m build
