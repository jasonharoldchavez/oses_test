[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming_guardian"
version = "1.0.0"
authors = [
    { name="Jason Harold Chavez" }
]
description = "Streaming Guardian: Commercial SDK for streaming anomaly detection and sequential analytics."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
]

[tool.setuptools]
packages = ["streaming_guardian", "streaming_guardian.detectors"]
